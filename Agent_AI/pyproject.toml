[project]
name = "homelab-sentinel"
version = "0.5.0"
description = "Agentic homelab operations: LangGraph agent with a human-in-the-loop approval gate, Telegram/Alexa interfaces, systemd-timer monitors, and a local-first LLM"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "langchain-core>=1.4.0",
    "langchain-openai>=0.3.0",
    "langfuse<3",
    "langgraph>=1.2.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.2",
    "speedtest-cli>=2.1.3",
    "uvicorn>=0.47.0",
]
