[project]
name = "homelab-sentinel"
version = "0.5.0"
description = "Agentic homelab operations: LangGraph agent with a human-in-the-loop approval gate, Telegram/Alexa interfaces, systemd-timer monitors, and a local-first LLM"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "langchain-core>=1.4.0",
    "langchain-openai>=0.3.0",
    "langfuse<3",
    "langgraph>=1.2.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.2",
    "speedtest-cli>=2.1.3",
    "uvicorn>=0.47.0",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.1.1",
    "respx>=0.23.1",
    "ruff>=0.15.20",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501", "E402"]

[tool.mypy]
ignore_missing_imports = true
exclude = ["legacy/"]
