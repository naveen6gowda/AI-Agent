# ======================================================================
# HomelabSentinel — Service Catalog (EXAMPLE / template)
# ----------------------------------------------------------------------
# This file tells the agent what's in YOUR homelab so it never has to
# guess. Copy to `catalog.yaml` (gitignored) and edit for your setup.
# It is loaded and validated by catalog.py (pydantic) — a typo fails
# fast at startup instead of at 3am inside a monitor.
#
#   criticality   : critical | high | medium | lab   (how loudly to alert)
#   restart_policy: ask | auto | never               (ask = needs your tap;
#                   never = refused in code, even after an approval)
# ======================================================================

defaults:                         # inherited by any service that omits a field
  max_backup_age_h: 168           # 7 days
  restart_policy: ask             # safest default
  reachability_timeout_s: 5
  alert_on_status_change: true

services:
  # ---- critical infrastructure ----
  - vmid: 105
    name: OPNSense
    kind: qemu
    node: pve
    criticality: critical
    purpose: "Router / firewall / DHCP / VLAN gateway (OPNsense)"
    max_backup_age_h: 24
    restart_policy: never         # restarting the router = whole-house outage
    endpoints:
      - name: web-ui
        host: router.lan
        port: 443
        proto: https
        path: /
        verify_tls: false
        expected_status: 200

  - vmid: 100
    name: HomeAssistant
    kind: qemu
    node: pve
    criticality: critical
    purpose: "Home Assistant Core — automations, energy, presence"
    max_backup_age_h: 24
    restart_policy: ask
    endpoints:
      - name: api
        host: homeassistant.lan
        port: 8123
        proto: http
        path: /api/
        auth_env: HA_TOKEN        # bearer token is read from this env var
        expected_status: 200

  # ---- services ----
  - vmid: 101
    name: llm
    kind: lxc
    node: pve
    criticality: high
    purpose: "Local llama.cpp inference (the helper model)"
    restart_policy: ask
    endpoints:
      - name: openai-api
        host: llm.lan
        port: 8383
        proto: http
        path: /v1/models
        auth_env: LLAMACPP_API_KEY
        expected_status: 200

  - vmid: 103
    name: Docker
    kind: qemu
    node: pve
    criticality: high
    purpose: "Docker host — media, DNS, vault, etc."
    restart_policy: ask
    endpoints:
      - name: dns
        host: docker.lan
        port: 53
        proto: tcp               # plain TCP-connect probe (no HTTP)

# Proxmox host — used for SMART disk scans + accurate guest-memory reads over SSH.
proxmox_host:
  node: pve
  ssh_user: root
  ssh_host: pve.lan
  ssh_port: 22
  disks_to_monitor:
    - /dev/sda
    - /dev/nvme0n1
  backup_storage:
    - local-backups

# Energy (optional) — the assistant sums these accumulators as the "total".
energy:
  tariff:
    currency: EUR
    price_per_kwh: 0.30
  watch:
    - entity_id: sensor.fridge_total_energy
      name: Refrigerator
    - entity_id: sensor.washer_total_energy
      name: Washing machine

# Approval policy — tools that always stop at the human gate. Config can only
# TIGHTEN the built-in set in catalog.py, never loosen it.
policy:
  destructive_tools:
    - restart_lxc
    - restart_vm
    - restart_docker_container
    - call_ha_service

# Docker monitor — containers that are SUPPOSED to sit in "Exited (0)".
# Explicit allowlist on purpose: `docker stop jellyfin` also exits 0 and must
# keep alerting. Only a clean exit is ignored; a failed one-shot still pages.
docker:
  expected_down:
    - name: "my-stack-init-1"    # globs allowed
      reason: "one-shot init container, exits after setup"
  expected_down_labels:          # or label the service instead
    sentinel.expected_down: "true"

# Alerting (alert_state.py) — page on the CHANGE: one DOWN, one RECOVERED,
# a reminder every remind_after_h while it stays broken. critical rings any
# time; high-only messages are delivered silently inside quiet_hours.
alerting:
  quiet_hours: [23, 7]
  remind_after_h: 6

# ESPHome devices (esphome_monitor.py) — online/offline via Home Assistant,
# checked every 2 minutes. Offline = ALL entities unavailable for
# offline_grace_s (rides out OTA flashes and reboots). Matched by MAC, then
# name. monitor: false parks a device: listed, never alerted.
esphome:
  offline_grace_s: 180
  devices:
    - name: Office Monitor
      mac: "02:00:00:00:00:01"
      ip: office-monitor.lan
    - name: Hall Clock
      mac: "02:00:00:00:00:02"
      ip: hall-clock.lan
    - name: Plant Moisture
      mac: "02:00:00:00:00:03"
      ip: plant-moisture.lan
      monitor: false
      note: "deep-sleep node — HA keeps its last values, so it can't be watched this way"
