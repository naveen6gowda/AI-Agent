<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
<title id="title">HomelabSentinel — an AI SRE that asks before it acts</title>
<desc id="desc">Animated example conversation: the operator asks whether backups are fine, the agent checks; the operator asks to restart a container, the agent pauses at an approval card, the operator approves, and the agent restarts the container through Portainer.</desc>
<style>@keyframes c0{0%,3.8%{opacity:0;transform:translateY(8px)}6.2%,92%{opacity:1;transform:translateY(0)}97%,100%{opacity:0;transform:translateY(0)}}.c0{animation:c0 16s ease-out infinite;opacity:0}@keyframes c1{0%,13.8%{opacity:0;transform:translateY(8px)}16.2%,92%{opacity:1;transform:translateY(0)}97%,100%{opacity:0;transform:translateY(0)}}.c1{animation:c1 16s ease-out infinite;opacity:0}@keyframes c2{0%,27.5%{opacity:0;transform:translateY(8px)}30.0%,92%{opacity:1;transform:translateY(0)}97%,100%{opacity:0;transform:translateY(0)}}.c2{animation:c2 16s ease-out infinite;opacity:0}@keyframes c3{0%,40.0%{opacity:0;transform:translateY(8px)}42.5%,92%{opacity:1;transform:translateY(0)}97%,100%{opacity:0;transform:translateY(0)}}.c3{animation:c3 16s ease-out infinite;opacity:0}@keyframes c4{0%,53.8%{opacity:0;transform:translateY(8px)}56.2%,92%{opacity:1;transform:translateY(0)}97%,100%{opacity:0;transform:translateY(0)}}.c4{animation:c4 16s ease-out infinite;opacity:0}@keyframes c5{0%,62.5%{opacity:0;transform:translateY(8px)}65.0%,92%{opacity:1;transform:translateY(0)}97%,100%{opacity:0;transform:translateY(0)}}.c5{animation:c5 16s ease-out infinite;opacity:0}@media (prefers-reduced-motion: reduce){.c0{animation:none;opacity:1}.c1{animation:none;opacity:1}.c2{animation:none;opacity:1}.c3{animation:none;opacity:1}.c4{animation:none;opacity:1}.c5{animation:none;opacity:1}}</style>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#0e2a33"/></linearGradient><linearGradient id="accent" x1="0" x2="1"><stop stop-color="#2dd4bf"/><stop offset="1" stop-color="#60a5fa"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern></defs>
<rect width="1280" height="560" rx="20" fill="url(#bg)"/><rect width="1280" height="560" rx="20" fill="url(#grid)"/>
<rect x="58" y="70" width="44" height="5" rx="2.5" fill="url(#accent)"/>
<text x="116" y="79" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#99d8db" text-anchor="start" letter-spacing="3">AGENTIC AI · HOMELAB OPERATIONS</text>
<text x="56" y="158" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#f1f5f9" text-anchor="start" >HomelabSentinel</text>
<text x="60" y="206" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#d1e4ed" text-anchor="start" >An AI site-reliability agent for my homelab</text>
<text x="60" y="238" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#2dd4bf" text-anchor="start" >that asks before it acts.</text>
<rect x="60" y="290" width="4" height="44" rx="2" fill="#fbbf24"/>
<text x="80" y="308" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#f1f5f9" text-anchor="start" >Human approval gate</text>
<text x="80" y="331" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#a8b8c8" text-anchor="start" >LangGraph interrupt() · default deny</text>
<rect x="60" y="352" width="4" height="44" rx="2" fill="#2dd4bf"/>
<text x="80" y="370" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#f1f5f9" text-anchor="start" >One tool registry, two doors</text>
<text x="80" y="393" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#a8b8c8" text-anchor="start" >Telegram / Alexa / CLI and an MCP server</text>
<rect x="60" y="414" width="4" height="44" rx="2" fill="#60a5fa"/>
<text x="80" y="432" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#f1f5f9" text-anchor="start" >Measured, not assumed</text>
<text x="80" y="455" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#a8b8c8" text-anchor="start" >pytest in CI · golden evals · Langfuse traces</text>
<rect x="60" y="476" width="4" height="44" rx="2" fill="#34d399"/>
<text x="80" y="494" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#f1f5f9" text-anchor="start" >100% local LLM</text>
<text x="80" y="517" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#a8b8c8" text-anchor="start" >LM Studio · OpenAI-compatible · €0 per call</text>
<rect x="700" y="36" width="540" height="488" rx="22" fill="#0a1824" stroke="#24435a" stroke-width="1.5"/>
<rect x="700" y="36" width="540" height="54" rx="22" fill="#10263a"/>
<rect x="700" y="68" width="540" height="22" fill="#10263a"/>
<circle cx="730" cy="64" r="6" fill="#34d399"/><circle cx="730" cy="64" r="6" fill="none" stroke="#34d399" stroke-width="2"><animate attributeName="r" values="6;14;6" dur="2.4s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values=".9;0;.9" dur="2.4s" repeatCount="indefinite"/></circle>
<text x="748" y="70" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#f1f5f9" text-anchor="start" >Sentinel</text>
<text x="1220" y="70" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#6b7f93" text-anchor="end" >LangGraph agent · local LLM</text>
<g class="c0"><rect x="990" y="110" width="230" height="46" rx="16" fill="#1d4f7a" stroke="#2f6fa5"/><text x="1008" y="143" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#f1f5f9" text-anchor="start" >are my backups ok?</text></g>
<g class="c1"><rect x="720" y="168" width="380" height="70" rx="16" fill="#15293b" stroke="#24435a"/><text x="738" y="201" font-family="'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="400" fill="#2dd4bf" text-anchor="start" >check_backups()</text><text x="738" y="225" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#f1f5f9" text-anchor="start" >Every guest is within its max backup age.</text></g>
<g class="c2"><rect x="1020" y="250" width="200" height="46" rx="16" fill="#1d4f7a" stroke="#2f6fa5"/><text x="1038" y="283" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#f1f5f9" text-anchor="start" >restart jellyfin</text></g>
<g class="c3"><rect x="720" y="308" width="500" height="118" rx="16" fill="#2a2210" stroke="#fbbf24"/><text x="740" y="338" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#fbbf24" text-anchor="start" letter-spacing="1.5">APPROVAL REQUIRED</text><text x="740" y="364" font-family="'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="400" fill="#f1f5f9" text-anchor="start" >restart_docker_container("jellyfin")</text><rect x="740" y="380" width="130" height="34" rx="10" fill="#14532d" stroke="#34d399"/><text x="805" y="403" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#bbf7d0" text-anchor="middle" >Approve</text><rect x="884" y="380" width="110" height="34" rx="10" fill="#3b1414" stroke="#f87171"/><text x="939" y="403" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#fecaca" text-anchor="middle" >Deny</text><text x="1200" y="403" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7f93" text-anchor="end" >default: deny</text></g><g class="c4"><rect x="736" y="376" width="138" height="42" rx="12" fill="none" stroke="#34d399" stroke-width="3"/></g>
<g class="c5"><rect x="720" y="438" width="400" height="70" rx="16" fill="#15293b" stroke="#24435a"/><text x="738" y="471" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#f1f5f9" text-anchor="start" >Approved by operator</text><text x="738" y="495" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#f1f5f9" text-anchor="start" >Restarted via Portainer · container healthy</text></g>
