name: CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: Agent_AI

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install (locked)
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Tests (policy-gate invariants, clients, retention)
        run: uv run pytest -q
      - name: Types (advisory while the baseline is burned down)
        run: uv run mypy .
        continue-on-error: true
